# jackrabbit-review settings.
#
# This file ships with the skill and holds the defaults. A reinstall or `npx skills update`
# replaces it, so put your own settings in one of these instead (same keys, any subset):
#   ~/.config/jackrabbit-review/config.yaml    for you, in every repository
#   .jackrabbit-review.yaml                    in a repository's root, for that repository
# The repository's file wins over yours, and yours over this one. Whatever you say when you
# start a review wins over all of them ("run them all at once", "skip uncommitted changes").

# Run the agents one at a time instead of side by side. Slower, easier on rate limits.
serial: false

# Also review changes that are not committed yet (staged, unstaged and new files).
include_uncommitted: false

# The branch or commit to measure the change against. Empty: the remote's default branch.
base:

# Which models to use, in words, as you would say it when starting a review.
# Empty: the default (Opus on medium effort in Claude Code; the reviewer agent's model in opencode).
# Examples: "fable"   "fable for the reviewers and opus on high to verify"
models:
